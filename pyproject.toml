[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-shared-utils"
version = "0.1.0"
description = "Shared utilities for hf"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4",
    "httpx>=0.24",
    "openai>=1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3",
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hf_shared_utils*"]
namespaces = true
